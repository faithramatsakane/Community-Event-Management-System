<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Events - CEMS</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <section class="nav-brand">
      <a href="index.html" class="logo">
        <img src="Images/CEMS.png" alt="CEMS Logo">
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html" class="active">Events</a></li>
        <li><a href="organizer.html">Organize</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <main class="events-container">
    <section class="events-header">
      <h2>Browse Community Events</h2>
      <p>Discover exciting events happening in your community</p>
    </section>

    <section class="filters-section">
      <section class="filter-group">
        <input type="search" id="searchInput" placeholder="Search events...">
      </section>
      <section class="filter-group">
        <label for="categoryFilter">Category:</label>
        <select id="categoryFilter">
          <option value="">All Categories</option>
          <option value="sports">Sports</option>
          <option value="music">Music</option>
          <option value="workshop">Workshop</option>
          <option value="social">Social</option>
          <option value="conference">Conference</option>
          <option value="charity">Charity</option>
        </select>
      </section>
      <section class="filter-group">
        <label for="dateFilter">Date:</label>
        <input type="date" id="dateFilter">
      </section>
      <section class="filter-group">
        <label for="priceFilter">Price Range:</label>
        <select id="priceFilter">
          <option value="">All Prices</option>
          <option value="free">Free</option>
          <option value="budget">Under R500</option>
          <option value="standard">R500 - R1000</option>
          <option value="premium">R1000+</option>
        </select>
      </section>
    </section>

    <!-- Events Grid -->
    <section class="events-grid" id="eventsGrid">
      <!-- Events will be populated here by JavaScript -->
    </section>

    <!-- No Results Message -->
    <section class="no-results hidden" id="noResults">
      <p>No events found. Try adjusting your filters.</p>
    </section>
  </main>
  
  <section class="modal hidden" id="eventModal">
    <section class="modal-content">
      <span class="close" onclick="closeEventModal()">&times;</span>
      <section id="modalEventDetails">
      </section>
    </section>
  </section>

  <footer>
    <p>&copy; 2026 Community Event Management System. All rights reserved.</p>
    <section class="footer-links">
      <a href="privacy-policy.html">Privacy Policy</a>
      <a href="#">Terms of Service</a>
      <a href="contactus.html">Contact Us</a>
    </section>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/events.js"></script>
</body>
</html>
