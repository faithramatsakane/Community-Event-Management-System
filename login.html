<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CEMS</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="nav-brand">
        <h1>🎉 CEMS</h1>
      </div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="events.html">Events</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <!-- Login Form -->
      <div class="auth-form" id="loginForm">
        <h2>Login to CEMS</h2>
        <form id="loginFormElement">
          <div class="form-group">
            <label for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" name="email" required>
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input type="password" id="loginPassword" name="password" required>
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" name="remember"> Remember me
            </label>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <!-- Divider -->
        <div style="text-align: center; margin: 1.5rem 0; position: relative;">
          <span style="background: white; padding: 0 1rem; color: #666; font-size: 0.9rem;">or</span>
          <div style="position: absolute; top: 50%; left: 0; right: 0; height: 1px; background: #E0E0E0; z-index: -1;"></div>
        </div>

        <!-- Google Sign-In Button -->
        <div id="googleSignInButton" style="display: flex; justify-content: center; margin: 1.5rem 0;">
          <!-- Google button will be rendered here -->
        </div>

        <p class="auth-toggle">
          Don't have an account? <a href="#" onclick="toggleAuthForms()">Sign up here</a>
        </p>
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>

      <!-- Signup Form -->
      <div class="auth-form hidden" id="signupForm">
        <h2>Create Your Account</h2>
        <form id="signupFormElement">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" required>
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" required>
          </div>
          <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" name="email" required>
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" name="password" required>
            <small>Minimum 8 characters, include numbers and special characters</small>
          </div>
          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required>
          </div>
          <div class="form-group">
            <label for="userRole">User Type</label>
            <select id="userRole" name="role" required>
              <option value="">Select Role</option>
              <option value="attendee">Attendee</option>
              <option value="organizer">Event Organizer</option>
              <option value="volunteer">Volunteer</option>
            </select>
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" name="terms" required> 
              I agree to the Terms of Service and Privacy Policy
            </label>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Create Account</button>
        </form>
        <p class="auth-toggle">
          Already have an account? <a href="#" onclick="toggleAuthForms()">Login here</a>
        </p>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2024 Community Event Management System. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
